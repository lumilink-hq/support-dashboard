<!--
  Supabase "Reset password" email (/forgot-password). IN USE ON PRODUCTION
  since 2026-10-12: Supabase Dashboard -> Authentication -> Email Templates ->
  Reset password, subject "Reset your LumiLink password", body below. Keep
  the two in sync.

  The link carries a token_hash that /auth/confirm verifies on any device.
  Supabase's default template sends a one-time code link instead, which only
  works in the browser that requested the reset (/forgot-password no longer
  warns about that, so don't revert to the default).
-->
<h2>Reset your LumiLink password</h2>

<p>Someone asked to reset the password for this email on LumiLink. If it was you, click below to choose a new one.</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/account/password">Choose a new password</a>
</p>

<p>The link only works once and expires soon. If you didn't ask for this, you can ignore this email: your password stays the same.</p>
